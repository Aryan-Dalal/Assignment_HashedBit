<!DOCTYPE html>
<html>
<head>
    <title>JS User Input</title>
</head>
<body>

<h2>1. Even Numbers from 1 to 100</h2>
<button onclick="showEven()">Show Even Numbers</button>
<p id="even"></p>


<h2>2. Calculator</h2>
Enter Number 1: <input type="number" id="num1"><br><br>
Enter Number 2: <input type="number" id="num2"><br><br>
Operator (+, -, *, /): <input type="text" id="op"><br><br>
<button onclick="calculate()">Calculate</button>
<p id="calc"></p>


<h2>3. Tax Calculation</h2>
Enter Salary: <input type="number" id="salary"><br><br>
<button onclick="findTax()">Find Tax</button>
<p id="tax"></p>


<h2>4. Sum of Product of Digits</h2>
Enter Number 1: <input type="number" id="n1"><br><br>
Enter Number 2: <input type="number" id="n2"><br><br>
<button onclick="findProduct()">Calculate</button>
<p id="product"></p>


<script>

    // 1. Even numbers
    function showEven() {
        let result = "";
        for(let i = 1; i <= 100; i++) {
            if(i % 2 == 0) {
                result += i + " ";
            }
        }
        document.getElementById("even").innerHTML = result;
    }


    // 2. Calculator
    function calculate() {
        let a = parseFloat(document.getElementById("num1").value);
        let b = parseFloat(document.getElementById("num2").value);
        let op = document.getElementById("op").value;

        let res;

        switch(op) {
            case '+': res = a + b; break;
            case '-': res = a - b; break;
            case '*': res = a * b; break;
            case '/': res = a / b; break;
            default: res = "Invalid Operator";
        }

        document.getElementById("calc").innerHTML = "Result: " + res;
    }


    // 3. Tax calculation
    function findTax() {
        let salary = parseFloat(document.getElementById("salary").value);
        let tax = 0;

        switch(true) {
            case (salary > 0 && salary <= 500000):
                tax = 0;
                break;

            case (salary > 500000 && salary <= 1000000):
                tax = salary * 0.10;
                break;

            case (salary > 1000000 && salary <= 1500000):
                tax = salary * 0.20;
                break;

            case (salary > 1500000):
                tax = salary * 0.30;
                break;

            default:
                tax = "Invalid Salary";
        }

        document.getElementById("tax").innerHTML = "Tax: " + tax;
    }


    // 4. Sum of product of digits
    function findProduct() {
        let n1 = parseInt(document.getElementById("n1").value);
        let n2 = parseInt(document.getElementById("n2").value);

        let result = 0;

        while(n1 > 0 || n2 > 0) {
            let d1 = n1 % 10;
            let d2 = n2 % 10;

            result += d1 * d2;

            n1 = Math.floor(n1 / 10);
            n2 = Math.floor(n2 / 10);
        }

        document.getElementById("product").innerHTML = "Result: " + result;
    }

</script>

</body>
</html>
